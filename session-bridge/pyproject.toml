[project]
name = "session-bridge"
version = "0.1.1"
description = "Carry an agent session into another agent by converting its native format"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
session-bridge = "sessionbridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sessionbridge"]
