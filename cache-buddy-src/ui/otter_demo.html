<!doctype html>
<html><head><meta charset="utf-8"><title>Devin otter — mascot study</title>
<style>
  body { margin: 0; padding: 22px 26px; background: #F4F5F7;
    font: 13px "Segoe UI", system-ui, sans-serif; color: #1F2328; }
  h2 { font-size: 13px; font-weight: 600; color: #6B7280; margin: 18px 0 10px; }
  .row { display: flex; gap: 14px; align-items: flex-end; }
  .cell { background: #fff; border-radius: 14px; padding: 10px 8px 6px;
    display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 92px; }
  .cell b { font-size: 12px; font-weight: 600; }
  .cell i { font-style: normal; font-size: 11px; color: #9CA3AF; }
  .ref { opacity: .9; }
  .ring { position: relative; width: 38px; height: 38px; }
  .ring > svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring > div { position: absolute; left: 7px; top: 7px; }
  .card { background: #fff; border-radius: 14px; padding: 10px 12px; display: flex;
    flex-direction: column; gap: 8px; width: 250px; }
  .trk { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .trk .n { flex: 1; } .trk .t { font: 600 14px Consolas, monospace; }
  /* the otter moves like Clawd: it has eyes, so it hops instead of spins */
  .f-otter.m-none .art { animation: mz-breathe 3.6s ease-in-out infinite; }
  .f-otter.m-guarding .art { animation: mz-hop 1s steps(2,jump-none) infinite; }
  .f-otter.m-injecting .art { animation: mz-jump .55s ease-in-out infinite; }
  .f-otter.m-sent .art { animation: mz-hop2 1.1s ease-in-out infinite; }
  .f-otter.m-retry .art { animation: mz-wobble .5s ease-in-out infinite; }
  .f-otter.m-failed .art { transform: rotate(6deg); filter: grayscale(.75) opacity(.75); }
</style></head><body>
<h2>大图（守护中）· 左边两个是现在用的</h2><div class="row" id="big"></div>
<h2>各状态：休息 · 守护 · 忙 · 刚续上 · 重试 · 失败</h2><div id="states"></div>
<h2>实际尺寸：缓存卡片（36px / 多会话 24px）和半隐藏态的环（24px）</h2>
<div class="row" id="ctx"></div>
<script src="mascots.js"></script>
<script>
"use strict";
const FUR = "#8A5A3B", DARK = "#5E3B25", CREAM = "#EED9BD", INK = "#2B211C";
// Devin's trefoil (same path mascots.js ships), for the laptop lid
const DEVIN_PATH = (Mascots.devinLogo().match(/ d="([^"]+)"/) || [])[1] || "";

// the six eye variants Clawd has, so the shared CSS drives the otter too
function eyes(lx, rx, y, w, h) {
  const r = Math.min(w, h) / 2, my = y + h / 2;
  const pair = (dy, hh) => [lx, rx].map(x => `<rect x="${x}" y="${y + dy}"
    width="${w}" height="${hh}" rx="${Math.min(r, hh / 2)}"/>`).join("");
  const arc = x => `<path d="M${x},${my + 1.5} Q${x + w / 2},${my - 4} ${x + w},${my + 1.5}"/>`;
  const cross = x => `<path d="M${x},${y} L${x + w},${y + h} M${x + w},${y} L${x},${y + h}"/>`;
  const line = `fill="none" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"`;
  return `<g class="eyes" fill="${INK}">
    <g class="eyes-open">${pair(0, h)}</g>
    <g class="eyes-closed">${pair(h / 2 - 1, 2)}</g>
    <g class="eyes-left" transform="translate(-2,0)">${pair(0, h)}</g>
    <g class="eyes-right" transform="translate(2,0)">${pair(0, h)}</g>
    <g class="eyes-happy" ${line}>${arc(lx)}${arc(rx)}</g>
    <g class="eyes-dizzy" ${line}>${cross(lx)}${cross(rx)}</g></g>`;
}
const ear = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${FUR}"/>
  <circle cx="${x}" cy="${y}" r="${r / 2}" fill="${DARK}"/>`;

// big round eyes with a highlight: what makes it read "cute"
function cuteEyes(lx, rx, cy, r) {
  const one = (x, dx) => `<circle cx="${x + dx}" cy="${cy}" r="${r}"/>
    <circle cx="${x + dx + r * .38}" cy="${cy - r * .4}" r="${r * .36}" fill="#fff"/>`;
  const two = dx => one(lx, dx) + one(rx, dx);
  const line = `fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"`;
  const sleep = x => `<path d="M${x - r},${cy} Q${x},${cy + r * .9} ${x + r},${cy}"/>`;
  const happy = x => `<path d="M${x - r},${cy + r * .4} Q${x},${cy - r * 1.2} ${x + r},${cy + r * .4}"/>`;
  const k = r * .75;
  const cross = x => `<path d="M${x - k},${cy - k} L${x + k},${cy + k} M${x + k},${cy - k} L${x - k},${cy + k}"/>`;
  return `<g class="eyes" fill="${INK}">
    <g class="eyes-open">${two(0)}</g>
    <g class="eyes-closed" ${line}>${sleep(lx)}${sleep(rx)}</g>
    <g class="eyes-left">${two(-1.6)}</g><g class="eyes-right">${two(1.6)}</g>
    <g class="eyes-happy" ${line}>${happy(lx)}${happy(rx)}</g>
    <g class="eyes-dizzy" ${line}>${cross(lx)}${cross(rx)}</g></g>`;
}
const BLUSH = "#F4A3A0", PALE = "#FBF3E8", LID = "#DCE1E8";
// otter ears: small and low on the sides of the head (top ears = bear)
const sideEar = (x, y) => `<circle cx="${x}" cy="${y}" r="4.3" fill="${DARK}"/>
  <circle cx="${x}" cy="${y}" r="1.9" fill="#B47A55"/>`;
// shared chibi head: big, round, pale mask, blush, tiny nose (+ mouth)
function chibiHead(cy, mouth) {
  return `${sideEar(24.2, cy - 5)}${sideEar(71.8, cy - 5)}
    <ellipse cx="48" cy="${cy}" rx="24.5" ry="20" fill="${FUR}"/>
    <ellipse cx="48" cy="${cy + 6}" rx="17.5" ry="13" fill="${CREAM}"/>
    <ellipse cx="43.6" cy="${cy + 10}" rx="5.8" ry="4.6" fill="${PALE}"/>
    <ellipse cx="52.4" cy="${cy + 10}" rx="5.8" ry="4.6" fill="${PALE}"/>
    <ellipse cx="33" cy="${cy + 7.5}" rx="4.2" ry="2.5" fill="${BLUSH}" opacity=".75"/>
    <ellipse cx="63" cy="${cy + 7.5}" rx="4.2" ry="2.5" fill="${BLUSH}" opacity=".75"/>
    <path d="M45.2,${cy + 5.4} Q48,${cy + 3.9} 50.8,${cy + 5.4} Q49.8,${cy + 7.9} 48,${cy + 8.2}
      Q46.2,${cy + 7.9} 45.2,${cy + 5.4}Z" fill="${INK}"/>
    ${mouth ? `<path d="M48,${cy + 8.2} V${cy + 9.4} M48,${cy + 9.4} Q46.3,${cy + 11.2} 44.8,${cy + 10.1}
      M48,${cy + 9.4} Q49.7,${cy + 11.2} 51.2,${cy + 10.1}" fill="none" stroke="${INK}"
      stroke-width="1.15" stroke-linecap="round"/>` : ""}
    ${cuteEyes(37.6, 58.4, cy - 2, 4.3)}`;
}
const logo = (cx, cy, k) =>
  `<path d="${DEVIN_PATH}" fill="#8B93A1" transform="translate(${cx - 24 * k},${cy - 24 * k}) scale(${k})"/>`;

const ART = {
  // B: the plush — sitting, holding a laptop with Devin's mark on the lid
  laptop: () => `<g class="body"><ellipse cx="48" cy="68" rx="20" ry="7.5" fill="${DARK}"/>
    <circle cx="27.5" cy="35" r="3.6" fill="${DARK}"/><circle cx="68.5" cy="35" r="3.6" fill="${DARK}"/>
    <ellipse cx="48" cy="40" rx="21.5" ry="15" fill="${FUR}"/>
    <ellipse cx="48" cy="42.5" rx="16" ry="11" fill="${CREAM}"/>
    <ellipse cx="43.2" cy="46.5" rx="5.4" ry="4.4" fill="#FBF3E8"/>
    <ellipse cx="52.8" cy="46.5" rx="5.4" ry="4.4" fill="#FBF3E8"/>
    <path d="M44,41.6 Q48,39.6 52,41.6 Q50.9,44.8 48,45.2 Q45.1,44.8 44,41.6Z" fill="${INK}"/>
    ${eyes(38.6, 54, 33.5, 3.4, 5)}
    <rect x="29" y="53" width="38" height="21" rx="3.5" fill="#D5DAE1"/>
    <path d="${DEVIN_PATH}" fill="#6B7280" transform="translate(41.5,57) scale(.27)"/>
    <ellipse cx="30.5" cy="58" rx="4.6" ry="4" fill="${FUR}"/>
    <ellipse cx="65.5" cy="58" rx="4.6" ry="4" fill="${FUR}"/></g>`,
  // B1: chibi — big head, small round body, little laptop hugged to the
  // chest, feet and a tail curling out behind
  hug: () => `<g class="body">
    <path d="M62,71 Q79,73 80.5,62 Q81,57 77,58.5 Q75.5,66.5 62,65Z" fill="${DARK}"/>
    <ellipse cx="38.5" cy="76" rx="6.4" ry="3.6" fill="${DARK}"/>
    <ellipse cx="57.5" cy="76" rx="6.4" ry="3.6" fill="${DARK}"/>
    <ellipse cx="48" cy="64" rx="18" ry="13" fill="${FUR}"/>
    ${chibiHead(38, true)}
    <rect x="33.5" y="57" width="29" height="17" rx="3.4" fill="${LID}"/>
    ${logo(48, 65.5, .2)}
    <ellipse cx="35.5" cy="59" rx="4.6" ry="3.8" fill="${FUR}"/>
    <ellipse cx="60.5" cy="59" rx="4.6" ry="3.8" fill="${FUR}"/></g>`,
  // B2: peeking over the laptop lid — paws on the edge, mouth hidden
  peek: () => `<g class="body">
    ${chibiHead(39, false)}
    <rect x="21" y="51" width="54" height="27" rx="5" fill="${LID}"/>
    ${logo(48, 65, .32)}
    <ellipse cx="33" cy="52" rx="5.4" ry="4" fill="${FUR}"/>
    <ellipse cx="63" cy="52" rx="5.4" ry="4" fill="${FUR}"/>
    <path d="M31,50.6 V53 M35,50.6 V53 M61,50.6 V53 M65,50.6 V53" stroke="${DARK}"
      stroke-width=".9" stroke-linecap="round" opacity=".55"/></g>`,
};
const NAMES = { laptop: "B · 上一版", hug: "B1 · 抱电脑 Q 版", peek: "B2 · 从电脑后探头" };
const EXPR = { none: "closed", guarding: "open", busy: "right", sent: "happy",
  retry: "dizzy", failed: "dizzy" };
const FX = '<span class="fxz z1">z</span><span class="fxz z2">z</span><span class="fxz z3">z</span>' +
  [1, 2, 3, 4].map(i => `<svg class="fx-spark s${i}" viewBox="0 0 20 20"><path d="M10,1 Q11.4,8.6 19,10
  Q11.4,11.4 10,19 Q8.6,11.4 1,10 Q8.6,8.6 10,1 Z"/></svg>`).join("");

function box(px) { const d = document.createElement("div");
  d.style.cssText = `width:${px}px;height:${px}px;position:relative`; return d; }
function otter(kind, mode, px) {
  const d = box(px), m = document.createElement("div");
  m.className = `mascot f-otter m-${mode} e-${EXPR[mode]} side-right`;
  m.innerHTML = `<div class="inner"><div class="fx">${FX}</div>
    <svg class="art" viewBox="0 0 96 96">${ART[kind]()}</svg></div>`;
  d.appendChild(m); return d;
}
function brand(fam, mode, px) { const d = box(px), m = document.createElement("div");
  d.appendChild(m); Mascots.create(m, { family: fam, mode }); return d; }
function cell(el, title, sub, cls) { const c = document.createElement("div");
  c.className = "cell " + (cls || ""); c.append(el);
  c.insertAdjacentHTML("beforeend", `<b>${title}</b>` + (sub ? `<i>${sub}</i>` : ""));
  return c; }

const big = document.getElementById("big");
big.append(cell(brand("claude", "guarding", 96), "Clawd", "Claude Code", "ref"),
  cell(brand("devin", "guarding", 96), "Devin logo", "现在", "ref"));
for (const k in ART) big.append(cell(otter(k, "guarding", 96), NAMES[k]));

const st = document.getElementById("states");
for (const k in ART) { const r = document.createElement("div"); r.className = "row";
  r.style.marginBottom = "10px";
  for (const m in EXPR) r.append(cell(otter(k, m, 56), m === "none" ? NAMES[k] : "", m));
  st.append(r); }

function ring(el) { const r = document.createElement("div"); r.className = "ring";
  const C = 2 * Math.PI * 16.5;
  r.innerHTML = `<svg viewBox="0 0 38 38"><circle cx="19" cy="19" r="16.5" fill="none"
    stroke="#EEF0F2" stroke-width="2.4"/><circle cx="19" cy="19" r="16.5" fill="none"
    stroke="#3FA46A" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="${C}"
    stroke-dashoffset="${C * .3}"/></svg>`; r.append(el); return r; }
const ctx = document.getElementById("ctx");
const card = document.createElement("div"); card.className = "card";
const rows = [["claude", "Cache Buddy", "212.4K"], ["devin", "Casual Greeting", "16.9K"],
  ["laptop", "B · 上一版", "16.9K"], ["hug", "B1 · Q 版", "16.9K"], ["peek", "B2 · 探头", "16.9K"]];
rows.forEach(([k, n, t], i) => { const r = document.createElement("div"); r.className = "trk";
  r.append(ART[k] ? otter(k, "guarding", i < 2 ? 36 : 36) : brand(k, "guarding", 36));
  r.insertAdjacentHTML("beforeend", `<span class="n">${n}</span><span class="t">${t}</span>`);
  card.append(r); });
const card2 = document.createElement("div"); card2.className = "card"; card2.style.width = "200px";
rows.forEach(([k, n]) => { const r = document.createElement("div"); r.className = "trk";
  r.append(ART[k] ? otter(k, "guarding", 24) : brand(k, "guarding", 24));
  r.insertAdjacentHTML("beforeend", `<span class="n">${n}</span>`); card2.append(r); });
const peek = document.createElement("div"); peek.className = "card"; peek.style.width = "auto";
peek.style.flexDirection = "row";
rows.forEach(([k]) => peek.append(ring(ART[k] ? otter(k, "guarding", 24) : brand(k, "guarding", 24))));
ctx.append(card, card2, peek);
</script></body></html>
